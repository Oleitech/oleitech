<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<meta name="robots" content="noindex, nofollow">
<title>Eduardo faz 30!</title>
<link href="//fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,700;1,700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'DM Sans', sans-serif;
    background: linear-gradient(160deg, #0D1B2A, #132D46);
    color: #fff;
    min-height: 100vh;
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 60px 20px 80px;
    text-align: center;
  }
  .badge {
    display: inline-block;
    background: #2164f4;
    color: #fff;
    font-weight: 700;
    padding: 6px 18px;
    border-radius: 999px;
    font-size: 0.9rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 18px;
  }
  h1 {
    font-size: 2.6rem;
    font-weight: 700;
    margin: 0 0 8px;
  }
  h1 span { color: #2164f4; }
  p.subtitle {
    font-size: 1.1rem;
    opacity: 0.8;
    margin-bottom: 40px;
  }
  video {
    width: 100%;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    background: #000;
  }
  .gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-top: 40px;
  }
  .gallery img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  @media (max-width: 560px) {
    h1 { font-size: 1.9rem; }
    .gallery { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
  <div class="wrap">
    <span class="badge">30 Anos</span>
    <h1>Parabéns, <span>Eduardo</span>!</h1>
    <p class="subtitle">A caminho dos 30... com estilo.</p>

    <video controls playsinline poster="">
      <source src="uploads/IMG_1936_20260902_225941_d86b6a.mov" type="video/mp4">
      O teu navegador não suporta vídeo.
    </video>

    <div class="gallery">
      <img src="uploads/IMG_5047_20260902_225742_3eb386.png" alt="Eduardo">
      <img src="uploads/IMG_5048_20260902_230006_4dce35.png" alt="Eduardo">
      <img src="uploads/IMG_5049_20260902_225958_d8e0f5.jpeg" alt="Eduardo">
    </div>
  </div>
</body>
</html>
