<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Trincheira TV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  video { width: 100vw; height: 100vh; object-fit: contain; background: #000; display: block; }
  #unlock-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, sans-serif; font-size: 1.4rem; cursor: pointer;
    z-index: 10; text-align: center; padding: 20px;
  }
  #fallback {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: #000; color: #fff; font-family: -apple-system, sans-serif; font-size: 1.4rem;
    text-align: center; padding: 20px;
  }
</style>
</head>
<body>
  <div id="unlock-overlay">Clique para ativar o som</div>
  <div id="fallback">Sport TV 1 Full HD indisponível de momento.</div>
  <video id="video" autoplay playsinline muted></video>

  <script>
    var STREAM_URL = 'http://ta.sdmabm.com:8080/live/kxfbhlac/jbz8ZhO843/20.m3u8';
    var video = document.getElementById('video');

    function showFallback() {
      document.getElementById('fallback').style.display = 'flex';
      video.style.display = 'none';
    }

    if (window.Hls && Hls.isSupported()) {
      var hls = new Hls();
      hls.on(Hls.Events.ERROR, function (event, data) {
        if (data.fatal) showFallback();
      });
      hls.loadSource(STREAM_URL);
      hls.attachMedia(video);
    } else {
      video.src = STREAM_URL;
      video.onerror = showFallback;
    }
    video.play().catch(function () {});

    document.getElementById('unlock-overlay').addEventListener('click', function () {
      video.muted = false;
      video.play().catch(function () {});
      this.remove();
    }, { once: true });
  </script>
</body>
</html>
